[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli-tool"
version = "0.1.0"
description = "Zero-dependency CLI that groups files in a directory by extension, sums their sizes, and lists the largest files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "morenmike" }]
keywords = ["cli", "filesystem", "statistics", "disk-usage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.scripts]
filestats = "my_cli_tool.cli:main"

[tool.setuptools.packages.find]
include = ["my_cli_tool*"]
